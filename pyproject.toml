[project]
name = "whale-core"
version = "1.0.0"
description = "Whale: a personal AI agent core - memory, persona, tools, tasks, autonomy and devices"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agent", "companion-ai", "memory", "personal-ai"]
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "cryptography>=41",
    "jieba>=0.42",          # Chinese word segmentation for group keywords and portraits
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
whale = "whale.cli:main"

[project.urls]
Homepage = "https://github.com/amwangfan/whale-core"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whale"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "whale/web"
"contracts/device" = "whale/contracts/device"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
