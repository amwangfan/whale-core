[project]
name = "whale-core"
version = "0.1.0"
description = "Whale intelligence layer: companion AI core with events-in / intents-out contracts, memory, persona cards, plugin system and safety gates"
readme = "README.md"
# Third-party notices only; the project-level license is still owner-pending.
license-files = ["licenses/*"]
requires-python = ">=3.11"
keywords = ["companion-ai", "agent", "memory", "plugins", "whale-io"]
# Windows 没有系统 IANA 时区库，zoneinfo.ZoneInfo("Asia/Shanghai") 需要 tzdata；
# Linux / macOS 走系统时区库，不会安装此依赖（CI 为 ubuntu，不受影响）。
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# websockets 17 已验证兼容（PCM 中继 sync server/client 离线索引测试通过）
voice = ["websockets>=14,<18"]
desktop = ["pywebview>=5,<7"]
# 设备面（whale-mobile D1-D4）最小依赖，均为可选、懒加载：
# - websockets：/api/v1/devices/ws 长连服（与 voice 同一依赖、同一版本窗）；
# - cryptography：Ed25519 挑战-应答验签（§3）。Python stdlib 无 Ed25519，
#   自实现不安全，故引入这一个密码学依赖；registry/校验器本身仍是纯 stdlib。
devices = ["websockets>=14,<18", "cryptography>=41"]

[project.scripts]
whale = "whale_core.cli.main:main"
whale-desktop = "whale_core.cli.desktop:main"

[project.urls]
Homepage = "https://github.com/amwangfan/whale-core"
Repository = "https://github.com/amwangfan/whale-core"
"Parent monorepo" = "https://github.com/amwangfan/whale-io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whale_core", "plugins/search_web", "plugins/weq_channel"]
# Release builders stage the compiled console here; normal editable installs
# can continue to use web/dist without committing generated JavaScript.
artifacts = ["src/whale_core/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." 让仓库根的 evals 包（issue #19 回放基准）可被测试导入
pythonpath = ["src", "plugins", "."]
