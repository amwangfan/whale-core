name: whale-core tests

# Only run when explicitly requested from Actions.
on:
  workflow_dispatch:

concurrency:
  group: whale-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # 收齐两个版本的证据，不互相取消
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,devices]"
      - run: python -m pytest tests -q
