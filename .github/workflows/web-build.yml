name: web console build

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-build.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:

concurrency:
  group: whale-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install hatchling
      - run: python scripts/build_release.py
        working-directory: .
