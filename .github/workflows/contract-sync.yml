# 跨仓契约漂移校验（issue #46）——仅手动触发。
#
# 设计纪律（防止合并时序造成假失败）：
#   1. 协议变更先在 canonical（whale-mobile）落定；
#   2. 再同步 whale-core 镜像；
#   3. 最后用本 workflow 以**同一批次的两个候选 ref** 做联合验收。
# 本 workflow 不做任何豁免；两侧任一处漂移即失败并列出文件。
name: contract-sync

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "whale-core 候选 ref"
        required: true
        default: main
      mobile_ref:
        description: "whale-mobile 候选 ref"
        required: true
        default: main
      mobile_repository:
        description: "Mobile repository (use dreaminutes/whale-mobile for this fork's paired batch)"
        required: true
        default: amwangfan/whale-mobile
      suite:
        description: "contracts = schema and generated tables; full = include both loopback test suites"
        type: choice
        default: contracts
        options:
          - contracts
          - full

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          ref: ${{ inputs.core_ref }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mobile_repository }}
          ref: ${{ inputs.mobile_ref }}
          path: mobile
          # whale-mobile 当前是 public 仓，GITHUB_TOKEN 即可读取；
          # 若将来转私有，在此补 token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install joint check dependencies
        run: python -m pip install -e 'core[dev,devices]' -r mobile/server/requirements.txt
      - name: Contracts and generated table gate
        if: ${{ inputs.suite != 'full' }}
        run: python core/scripts/check_device_interop.py --mobile mobile --contracts-only --log-dir interop-results
      - name: Full Core and Mobile loopback gate
        if: ${{ inputs.suite == 'full' }}
        run: python core/scripts/check_device_interop.py --mobile mobile --log-dir interop-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-interop-results
          path: interop-results
