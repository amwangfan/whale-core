name: temporary persona memory integration verification
on:
  push:
    branches:
      - feat/persona-memory-evolution-20261108
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,devices]"
      - run: python -m compileall -q src/whale_core
      - run: python -m pytest tests -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile --ignore-scripts
      - run: pnpm -C web build
      - run: pnpm -C web test
