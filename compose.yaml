services:
  whale:
    build: .
    image: whale-core:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WHALE_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - whale-data:/data/whale
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 20s

volumes:
  whale-data:
